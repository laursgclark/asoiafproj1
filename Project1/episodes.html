
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game of Thrones | Episodes</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="snow"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">Game of Thrones</a>

        <div class="nav-links">
            <a href="index.html">Characters</a>
            <a href="episodes.html" class="active">Episodes</a>
            <a href="books.html">Books</a>
        </div>
    </nav>

    <main class="page-container">

        <h1>Episodes</h1>

        <p>Explore episodes across the world of Westeros.</p>

        <div class="search-controls">

            <input
                type="text"
                id="episode-search"
                placeholder="Search show title, season #, or episode #..."
            >

            <select id="show-filter">
                <option value="all">All Shows</option>
                <option value="82">Game of Thrones</option>
                <option value="44778">House of the Dragon</option>
                <option value="53063">A Knight of the Seven Kingdoms</option>
            </select>

            <select id="season-select">
                <option value="all">All Seasons</option>
            </select>

            <input
                type="number"
                id="episode-number-filter"
                min="1"
                placeholder="Episode #"
            >

        </div>

        <p id="episode-count">Loading episodes...</p>

        <div id="episode-list">

            <section class="show-section">
                <h2 class="show-heading">Game of Thrones</h2>
                <div id="got-episodes" class="show-episodes">
                    <p>Loading episodes...</p>
                </div>
            </section>

            <section class="show-section">
                <h2 class="show-heading">House of the Dragon</h2>
                <div id="hotd-episodes" class="show-episodes">
                    <p>Loading episodes...</p>
                </div>
            </section>

            <section class="show-section">
                <h2 class="show-heading">A Knight of the Seven Kingdoms</h2>
                <div id="knight-episodes" class="show-episodes">
                    <p>Loading episodes...</p>
                </div>
            </section>

        </div>

        <p class="tvmaze-credit">
            Episode information provided by
            <a href="https://www.tvmaze.com/" target="_blank" rel="noopener noreferrer">TVmaze</a>.
        </p>

    </main>

    <script src="tvmaze.js"></script>

</body>
</html>
